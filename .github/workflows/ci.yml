name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality check
        env:
          # Format-valid, non-production Clerk placeholders for compile/prerender only.
          # Encoded mock host/secret payloads — NOT real Clerk dashboard keys and NOT from .env.local.
          # Real sign-in is not exercised in CI.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bW9jay1jaS5uZXh0Y3VlLmNsZXJrLmFjY291bnRzLmRldiQ=
          CLERK_SECRET_KEY: sk_test_bW9jay1jaS1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uJA==
        run: npm run check
